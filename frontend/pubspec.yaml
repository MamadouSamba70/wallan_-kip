name: wallan
description: "Wallan — Bracelet Intelligent de Surveillance Médicale"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  dio: ^5.10.0
  google_fonts: ^8.1.0
  flutter_riverpod: ^3.3.2

  # Stockage sécurisé pour les tokens JWT (Keystore Android / Keychain iOS)
  flutter_secure_storage: ^9.2.4

  # Logger HTTP lisible dans la console pour faciliter le débogage des appels API
  pretty_dio_logger: ^1.4.0

  # Graphiques interactifs biométriques pour l'écran de statistiques (Semaine 4)
  fl_chart: ^0.70.2

  # Stockage local des mesures biométriques hors-ligne (Semaine 6 — Hady)
  sqflite: ^2.3.0
  path: ^1.8.3

  # Détection du retour réseau pour déclencher la synchronisation (Semaine 6-7)
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# ─── Configuration de l'icône de l'application ────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/wallan_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/wallan_icon.png"
  windows:
    generate: true
    image_path: "assets/images/wallan_icon.png"
    icon_size: 48